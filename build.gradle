plugins {
    id 'java-library'
    id 'signing'
    id 'maven-publish'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
    id 'org.cyclonedx.bom' version '3.5.1'
    id 'org.sonarqube' version '7.5.0.8588'
}

sonarqube {
  properties {
    property "sonar.projectKey", "pjfanning_excel-streaming-reader"
    property "sonar.organization", "pjfanning"
    property "sonar.host.url", "https://sonarcloud.io"
    // the plugin seems to not detect our non-standard build-layout
    property "sonar.junit.reportPaths", "$projectDir/build/test-results/test"
  }
}

group = 'com.github.pjfanning'
version = '6.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withJavadocJar()
    withSourcesJar()
}

// Optional poi-shared-strings support, published as the 'poiSharedStrings' feature of the main jar.
// This is what registerFeature with the main source set did; that is deprecated and fails in Gradle 10.
def poiSharedStringsCapability = "${project.group}:${project.name}-poi-shared-strings:${project.version}"

configurations {
    poiSharedStringsImplementation {
        canBeConsumed = false
        canBeResolved = false
    }
    compileOnly.extendsFrom(poiSharedStringsImplementation)
    testImplementation.extendsFrom(poiSharedStringsImplementation)

    [poiSharedStringsApiElements: Usage.JAVA_API, poiSharedStringsRuntimeElements: Usage.JAVA_RUNTIME].each { name, usage ->
        create(name) {
            canBeConsumed = true
            canBeResolved = false
            if (usage == Usage.JAVA_RUNTIME) {
                extendsFrom(poiSharedStringsImplementation)
            }
            attributes {
                attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, usage))
                attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
                attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
                attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
                attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
            }
            outgoing {
                capability(poiSharedStringsCapability)
                artifact(tasks.named('jar'))
            }
        }
    }
}

components.java {
    addVariantsFromConfiguration(configurations.poiSharedStringsApiElements) {
        mapToMavenScope('compile')
        mapToOptional()
    }
    addVariantsFromConfiguration(configurations.poiSharedStringsRuntimeElements) {
        mapToMavenScope('runtime')
        mapToOptional()
    }
}

repositories {
    mavenCentral()
    // maven { url = "https://repository.apache.org/content/groups/staging/" }
}

ext {
    poiVersion = '6.0.0'
    poiSharedStringsVersion = '3.0.0'
    slf4jVersion = '2.0.20'
}

dependencies {
    api "org.apache.poi:poi:$poiVersion"
    api "org.apache.poi:poi-ooxml:$poiVersion"
    implementation "org.slf4j:slf4j-api:$slf4jVersion"
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.apache.xmlbeans:xmlbeans:5.4.1'
    poiSharedStringsImplementation "com.github.pjfanning:poi-shared-strings:$poiSharedStringsVersion"
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.nanohttpd:nanohttpd:2.3.1'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testRuntimeOnly "org.slf4j:slf4j-simple:$slf4jVersion"
    testRuntimeOnly 'org.apache.logging.log4j:log4j-to-slf4j:2.26.1'
}

test {
    options {
        systemProperties(System.getProperties())
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

tasks.named('jar') {
    manifest {
        attributes('Automatic-Module-Name': 'com.github.pjfanning.excelstreamingreader')
    }
}

compileTestJava.dependsOn('copyLicenseToBuildResources')
jar.dependsOn('copyLicenseToBuildResources')
javadoc.dependsOn('copyLicenseToBuildResources')

nexusPublishing {
    repositories {
        // see https://central.sonatype.org/publish/publish-portal-ossrh-staging-api/#configuration
        sonatype {
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
        }
    }
}

publish.dependsOn cyclonedxBom

publishing {
    publications {
        mavenJava(MavenPublication) {
            from(components.java)
            pom {
                name = 'excel-streaming-reader'
                description = 'Streaming Excel reader'
                url = 'https://github.com/pjfanning/excel-streaming-reader'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'monitorjbl'
                        name = 'Taylor Jones'
                        email = 'monitorjbl@gmail.com'
                    }
                    developer {
                        id = 'pjfanning'
                        name = 'PJ Fanning'
                        url = 'https://github.com/pjfanning'
                    }
                }
                scm {
                    url = 'https://github.com/pjfanning/excel-streaming-reader'
                    connection = 'scm:git://github.com/pjfanning/excel-streaming-reader.git'
                    developerConnection = 'scm:git://github.com/pjfanning/excel-streaming-reader.git'
                }
            }
        }
    }
}

signing {
    def signingKey = findProperty("signingKey")
    def signingPassword = findProperty("signingPassword")
    useInMemoryPgpKeys(signingKey, signingPassword)
    sign publishing.publications.mavenJava
}

tasks.register('copyLicenseToBuildResources', Copy) {
    from layout.projectDirectory.file("LICENSE")
    into layout.buildDirectory.dir("resources/main/META-INF")
}
